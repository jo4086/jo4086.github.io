<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1090" role="img" aria-labelledby="title desc">
  <title id="title">사이트 운영과 게임 데이터 관리의 책임 분리</title>
  <desc id="desc">웹 관리자는 이용 추이와 사이트 운영을 맡도록 구상했다. Electron Data Studio는 별도로 CSV를 JSON으로 변환하고 검증, 버전 비교를 수행한다. 일부 편집 작업본은 진행 중이고 dry-run과 데이터베이스 승인 반영은 계획이다. 스킬 아이콘은 WZ 원본에서 C# 추출기로 PNG를 만들어 Electron 목록에 연결하는 별도 경로다.</desc>
  <rect width="480" height="1090" rx="24" fill="#f5f8fb"/>
  <text x="26" y="47" font-size="23" font-weight="800" fill="#18314b" font-family="sans-serif">서로 다른 관리 책임</text>
  <text x="26" y="74" font-size="15" fill="#526b82" font-family="sans-serif">사이트 운영과 로컬 게임 데이터 처리를 분리</text>

  <rect x="24" y="103" width="432" height="86" rx="16" fill="#fff" stroke="#b8ccdc" stroke-width="2"/>
  <text x="42" y="133" font-size="17" font-weight="800" fill="#18314b" font-family="sans-serif">웹 관리자 · 역할 구상</text>
  <text x="42" y="160" font-size="15" fill="#526b82" font-family="sans-serif">이용 추이 · 사이트 운영</text>
  <text x="42" y="180" font-size="13" fill="#526b82" font-family="sans-serif">현재 admin import 화면은 미연결 초안</text>

  <rect x="24" y="204" width="432" height="86" rx="16" fill="#eaf3f9" stroke="#a9c4d8" stroke-width="2"/>
  <text x="42" y="234" font-size="17" font-weight="800" fill="#18314b" font-family="sans-serif">Electron Data Studio · 구현 중</text>
  <text x="42" y="261" font-size="15" fill="#425d75" font-family="sans-serif">로컬 원본 파일 · 버전별 데이터 관리</text>
  <text x="42" y="281" font-size="13" fill="#526b82" font-family="sans-serif">파일과 DB 작업은 Main에서 처리</text>

  <text x="26" y="330" font-size="19" font-weight="800" fill="#18314b" font-family="sans-serif">경로 1 · CSV 데이터</text>
  <rect x="24" y="348" width="432" height="65" rx="12" fill="#fff" stroke="#b8ccdc"/>
  <text x="42" y="374" font-size="16" font-weight="700" fill="#18314b" font-family="sans-serif">게임 원본 분석 → CSV 준비</text>
  <text x="42" y="398" font-size="14" fill="#526b82" font-family="sans-serif">위컴알 활용은 작성자의 준비 과정</text>
  <path d="M240 414v22" stroke="#347aa5" stroke-width="3"/>
  <path d="m232 428 8 9 8-9" fill="none" stroke="#347aa5" stroke-width="3"/>
  <rect x="24" y="440" width="432" height="65" rx="12" fill="#fff" stroke="#b8ccdc"/>
  <text x="42" y="466" font-size="16" font-weight="700" fill="#18314b" font-family="sans-serif">Electron 가져오기 → JSON 변환</text>
  <text x="42" y="490" font-size="14" fill="#526b82" font-family="sans-serif">버전별 원본·산출물과 manifest 보관</text>
  <path d="M240 506v22" stroke="#347aa5" stroke-width="3"/>
  <path d="m232 520 8 9 8-9" fill="none" stroke="#347aa5" stroke-width="3"/>
  <rect x="24" y="532" width="432" height="65" rx="12" fill="#eaf5f1" stroke="#8db6a9"/>
  <text x="42" y="558" font-size="16" font-weight="700" fill="#245b58" font-family="sans-serif">검증 작업본 → 버전 차이 비교</text>
  <text x="42" y="582" font-size="14" fill="#386861" font-family="sans-serif">가져오기·검증·비교는 완료 기록</text>
  <path d="M240 598v22" stroke="#b88638" stroke-width="3" stroke-dasharray="5 5"/>
  <path d="m232 612 8 9 8-9" fill="none" stroke="#b88638" stroke-width="3"/>
  <rect x="24" y="624" width="432" height="58" rx="12" fill="#fff7ea" stroke="#e0bd83" stroke-dasharray="6 5"/>
  <text x="42" y="650" font-size="16" font-weight="700" fill="#855a20" font-family="sans-serif">편집 작업본 · 진행 중</text>
  <text x="42" y="673" font-size="14" fill="#855a20" font-family="sans-serif">일부 직업 정보 편집·재열기 구현</text>
  <path d="M240 682v22" stroke="#9b85b6" stroke-width="3" stroke-dasharray="5 5"/>
  <path d="m232 696 8 9 8-9" fill="none" stroke="#9b85b6" stroke-width="3"/>
  <rect x="24" y="708" width="432" height="66" rx="12" fill="#f8f6fc" stroke="#b9aed1" stroke-dasharray="6 5"/>
  <text x="42" y="734" font-size="16" font-weight="700" fill="#65518b" font-family="sans-serif">dry-run·승인 뒤 DB 반영 · 계획</text>
  <text x="42" y="758" font-size="14" fill="#65518b" font-family="sans-serif">현재 버전 정보 등록과 별개 단계</text>

  <g transform="translate(0 92)">
  <path d="M24 716h432" stroke="#a8bac8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="26" y="748" font-size="19" font-weight="800" fill="#18314b" font-family="sans-serif">경로 2 · 스킬 아이콘</text>
  <rect x="24" y="766" width="432" height="65" rx="12" fill="#fff" stroke="#b8ccdc"/>
  <text x="42" y="792" font-size="16" font-weight="700" fill="#18314b" font-family="sans-serif">WZ 원본 → C# 추출기</text>
  <text x="42" y="816" font-size="14" fill="#526b82" font-family="sans-serif">WzComparerR2의 WzLib 사용</text>
  <path d="M240 832v22" stroke="#347aa5" stroke-width="3"/>
  <path d="m232 846 8 9 8-9" fill="none" stroke="#347aa5" stroke-width="3"/>
  <rect x="24" y="858" width="432" height="78" rx="12" fill="#eaf5f1" stroke="#8db6a9"/>
  <text x="42" y="885" font-size="16" font-weight="700" fill="#245b58" font-family="sans-serif">버전별 PNG → Electron 목록 표시</text>
  <text x="42" y="909" font-size="14" fill="#386861" font-family="sans-serif">실제 추출과 로컬 이미지 연결 검증</text>
  <text x="26" y="970" font-size="13" fill="#526b82" font-family="sans-serif">전체 직업 자동 순회·이미지 DB 저장은 후속 범위</text>
  </g>
</svg>
